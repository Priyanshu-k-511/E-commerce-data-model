<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="2160" viewBox="0 0 1900 2160">
<defs>
  <style>
    text { font-family: Inter, Arial, sans-serif; fill: #17212b; }
    .title { font-size: 36px; font-weight: 700; letter-spacing: .5px; }
    .subtitle { font-size: 21px; fill: #52606d; }
    .entity-title { font-size: 22px; font-weight: 700; letter-spacing: .7px; }
    .field { font-size: 18px; }
    .field-small { font-size: 16px; fill: #33404c; }
    .relationship-title { font-size: 17px; font-weight: 700; }
    .relationship-line { font-size: 15px; fill: #33404c; }
    .legend { font-size: 16px; fill: #33404c; }
    .connector { fill: none; stroke: #59636e; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    .optional { stroke-dasharray: 9 7; }
    .required { stroke-dasharray: none; }
    .entity { fill: #ffffff; stroke: #46515c; stroke-width: 2; }
    .header { fill: #e9edf1; }
    .subdoc-header { fill: #f1f3f5; }
    .rel-card { fill: #ffffff; stroke: #b8c1ca; stroke-width: 1.4; }
  </style>
</defs>
<rect x="0" y="0" width="1900" height="2160" fill="#ffffff"/>
<text x="950" y="66" text-anchor="middle" class="title">BASIC E-COMMERCE DATA MODEL</text>
<text x="950" y="103" text-anchor="middle" class="subtitle">Logical ERD · MongoDB / Mongoose</text>
<path d="M650,330 L595,330 L595,850 L550,850" class="connector optional"/><path d="M900,475 L900,690" class="connector required"/><path d="M1300,820 L1235,820 L1235,895 L1170,895" class="connector optional"/><path d="M1150,240 L1815,240 L1815,1555 L1170,1555" class="connector required"/><path d="M300,1070 L300,1570 L650,1570" class="connector required"/><path d="M1170,1035 L1250,1035 L1250,1845 L1150,1845" class="connector required"/><rect x="650" y="140" width="500" height="319" rx="3" class="entity"/><rect x="650" y="140" width="500" height="46" class="header"/><text x="900.0" y="170" text-anchor="middle" class="entity-title">USER</text><text x="668" y="212" class="field">PK   _id : ObjectId</text><text x="668" y="251" class="field">username : String · unique · required</text><text x="668" y="290" class="field">role : String · user | seller | admin</text><text x="668" y="329" class="field">email : String · unique · required</text><text x="668" y="368" class="field">password : String · required</text><text x="668" y="407" class="field">FK   address : ObjectId → Address · optional</text><text x="668" y="446" class="field">createdAt, updatedAt : Date · timestamps</text><rect x="70" y="700" width="480" height="358" rx="3" class="entity"/><rect x="70" y="700" width="480" height="46" class="header"/><text x="310.0" y="730" text-anchor="middle" class="entity-title">ADDRESS</text><text x="88" y="772" class="field">PK   _id : ObjectId</text><text x="88" y="811" class="field">houseNo : String · required</text><text x="88" y="850" class="field">streetNo : String</text><text x="88" y="889" class="field">landmark : String</text><text x="88" y="928" class="field">locality : String · required</text><text x="88" y="967" class="field">state : String · required</text><text x="88" y="1006" class="field">pincode : String · required</text><text x="88" y="1045" class="field">createdAt, updatedAt : Date · timestamps</text><rect x="1300" y="700" width="470" height="163" rx="3" class="entity"/><rect x="1300" y="700" width="470" height="46" class="header"/><text x="1535.0" y="730" text-anchor="middle" class="entity-title">CATEGORY</text><text x="1318" y="772" class="field">PK   _id : ObjectId</text><text x="1318" y="811" class="field">name : String · required</text><text x="1318" y="850" class="field">createdAt, updatedAt : Date · timestamps</text><rect x="650" y="690" width="520" height="397" rx="3" class="entity"/><rect x="650" y="690" width="520" height="46" class="header"/><text x="910.0" y="720" text-anchor="middle" class="entity-title">PRODUCT</text><text x="668" y="762" class="field">PK   _id : ObjectId</text><text x="668" y="801" class="field">name : String · required</text><text x="668" y="840" class="field">description : String · required</text><text x="668" y="879" class="field">productImage : String · required</text><text x="668" y="918" class="field">price : Number · required · default 0</text><text x="668" y="957" class="field">stock : Number · default 0</text><text x="668" y="996" class="field">FK   category : ObjectId → Category · optional</text><text x="668" y="1035" class="field">FK   seller : ObjectId → User · required</text><text x="668" y="1074" class="field">createdAt, updatedAt : Date · timestamps</text><rect x="650" y="1360" width="520" height="650" rx="4" class="entity"/><rect x="650" y="1360" width="520" height="46" class="header"/><text x="910.0" y="1390" text-anchor="middle" class="entity-title">ORDER · DOCUMENT</text><text x="668" y="1433" class="field">PK   _id : ObjectId</text><text x="668" y="1471" class="field">orderPrice : Number · required</text><text x="668" y="1509" class="field">FK   orderedBy : ObjectId → User · required</text><text x="668" y="1547" class="field">FK   address : ObjectId → Address · required</text><text x="668" y="1585" class="field">orderItems : [OrderItem] · required embedded array</text><text x="668" y="1623" class="field">status : String · enum · default Ordered</text><text x="668" y="1661" class="field">createdAt, updatedAt : Date · timestamps</text><rect x="675" y="1695" width="470" height="245" rx="3" fill="#ffffff" stroke="#46515c" stroke-width="2" stroke-dasharray="8 6"/><rect x="675" y="1695" width="470" height="42" class="subdoc-header"/><text x="910.0" y="1722" text-anchor="middle" class="entity-title" style="font-size:18px">ORDER_ITEM · EMBEDDED SUBDOCUMENT</text><text x="690" y="1772" class="field-small">_id : ObjectId · Mongoose-generated</text><text x="690" y="1811" class="field-small">FK   productId : ObjectId → Product · required</text><text x="690" y="1850" class="field-small">quantity : Number · required · default 1</text><text x="690" y="1889" class="field-small">No timestamps on OrderItem</text><rect x="315" y="515" width="275" height="90" rx="8" class="rel-card"/><text x="329" y="541" class="relationship-title">User.address · optional</text><text x="329" y="564" class="relationship-line">Per User: 0..1 Address</text><text x="329" y="584" class="relationship-line">Per Address: 0..* Users</text><rect x="930" y="525" width="290" height="90" rx="8" class="rel-card"/><text x="944" y="551" class="relationship-title">Product.seller · required</text><text x="944" y="574" class="relationship-line">Per Product: exactly 1 User</text><text x="944" y="594" class="relationship-line">Per User: 0..* Products</text><rect x="1185" y="945" width="360" height="90" rx="8" class="rel-card"/><text x="1199" y="971" class="relationship-title">Product.category · optional</text><text x="1199" y="994" class="relationship-line">Per Product: 0..1 Category</text><text x="1199" y="1014" class="relationship-line">Per Category: 0..* Products</text><rect x="1390" y="1155" width="355" height="90" rx="8" class="rel-card"/><text x="1404" y="1181" class="relationship-title">Order.orderedBy · required</text><text x="1404" y="1204" class="relationship-line">Per Order: exactly 1 User</text><text x="1404" y="1224" class="relationship-line">Per User: 0..* Orders</text><rect x="70" y="1190" width="365" height="90" rx="8" class="rel-card"/><text x="84" y="1216" class="relationship-title">Order.address · required</text><text x="84" y="1239" class="relationship-line">Per Order: exactly 1 Address</text><text x="84" y="1259" class="relationship-line">Per Address: 0..* Orders</text><rect x="1280" y="1650" width="385" height="90" rx="8" class="rel-card"/><text x="1294" y="1676" class="relationship-title">OrderItem.productId · required</text><text x="1294" y="1699" class="relationship-line">Per OrderItem: exactly 1 Product</text><text x="1294" y="1719" class="relationship-line">Per Product: 0..* OrderItems</text><text x="910" y="1970" text-anchor="middle" class="field-small">OrderItem subdocuments are stored inside orderItems[]; there is no separate collection.</text><line x1="70" y1="2040" x2="1830" y2="2040" stroke="#c4cbd2" stroke-width="1.5"/><text x="80" y="2080" class="legend"><tspan font-weight="700">PK</tspan> = primary key     <tspan font-weight="700">FK</tspan> = ObjectId reference     <tspan font-weight="700">UK</tspan> = unique field     Dashed line = optional reference     Solid line = required reference</text><text x="80" y="2110" class="legend">Dashed outline = embedded subdocument. Multiplicity is shown in each relationship card; ObjectId refs are not SQL-enforced foreign keys.</text></svg>